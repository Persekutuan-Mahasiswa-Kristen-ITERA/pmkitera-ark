name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Placeholder values only; nothing in CI connects to Postgres or R2.
    # prisma.config.ts calls env("DIRECT_URL"), which throws when it is unset,
    # and `pnpm install` runs `prisma generate` from postinstall, so the URLs
    # must exist for the whole job. Unit tests stub their own env.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?pgbouncer=true
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # No `next build` step: src/app/layout.tsx uses next/font/google, which
      # downloads Inter and Playfair Display from Google Fonts at build time,
      # so the build cannot run offline. Vercel still builds on deploy.
